openapi: 3.0.3
info:
  title: Subscription Reminder API
  version: 0.1.0
  description: |
    Contract of the Subscription Reminder mobile application, Sprint 1 (SENG 321).

    **Rules**
    - Amounts are integers in kuruş (`amountKurus`); the only currency is TRY.
    - Dates are date-only `YYYY-MM-DD` values interpreted in the Europe/Istanbul calendar. Timestamps are in UTC.
    - Every renewal is calculated from the start date; if a month does not have that day, the last day of the month is used (31 Jan → 28 Feb → 31 Mar).
    - All errors of the operations defined in this contract use a single schema: `{ "code": "...", "message": "..." }`. 400 is the only status code for invalid input.
    - A record that belongs to another user returns 404, not 403.
    - Cancelling only removes a subscription from tracking; the real subscription at the service is not cancelled.
    - Reminders are generated by the server 3 days and 1 day before a renewal; the client cannot create reminders.
    - A method that is not defined for a defined path returns `405` (with an `Allow` header), and an undefined path returns `404`. These are general HTTP behaviours and are not written as operations in this contract. The response body of these two cases is not part of the contract guarantee; tests check the status code only.
    - `code` values are stable English identifiers. `message` texts are shown to users in Turkish (decision D-19), so the example messages in this file are Turkish.
servers:
  - url: http://localhost:8000
    description: Local development (docker compose)
tags:
  - name: auth
    description: Registration and login
  - name: subscriptions
    description: Subscription tracking list
  - name: reminders
    description: Generated reminders (read-only)
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: registerUser
      summary: Creates a new account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
            example:
              email: ayse@example.com
              password: strong-password-123
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email is already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: EMAIL_ALREADY_REGISTERED
                message: Bu e-posta ile kayıtlı bir hesap var.
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Logs in with email and password and returns a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Wrong email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_CREDENTIALS
                message: E-posta veya şifre hatalı.
  /subscriptions:
    post:
      tags: [subscriptions]
      operationId: createSubscription
      summary: Adds a subscription to the tracking list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreate'
            example:
              serviceName: Netflix
              amountKurus: 22999
              period: monthly
              startDate: '2026-01-31'
      responses:
        '201':
          description: Subscription added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: An active subscription with the same service and period already exists (service name comparison ignores letter case)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SUBSCRIPTION_ALREADY_ACTIVE
                message: Bu servis ve periyot için aktif bir abonelik zaten var.
    get:
      tags: [subscriptions]
      operationId: listSubscriptions
      summary: Lists the user's subscriptions with their reminders
      description: |
        Cancelled records are listed too, with `status: cancelled`. Order: `createdAt` descending (newest first).
      responses:
        '200':
          description: Subscription list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /subscriptions/{id}:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    get:
      tags: [subscriptions]
      operationId: getSubscription
      summary: Returns a single subscription
      responses:
        '200':
          description: Subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /subscriptions/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      tags: [subscriptions]
      operationId: cancelSubscription
      summary: Removes a subscription from the tracking list
      description: |
        Only ends tracking in the application; the real subscription at the service is not cancelled.
        After cancelling, no new reminders are generated; reminders generated earlier stay in the list.
      responses:
        '200':
          description: Subscription cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Subscription is already cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: ALREADY_CANCELLED
                message: Bu abonelik zaten iptal edilmiş.
  /reminders:
    get:
      tags: [reminders]
      operationId: listReminders
      summary: Returns the user's generated reminders as a flat list
      responses:
        '200':
          description: Reminder list (`remindOn` descending, newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reminder'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SubscriptionId:
      name: id
      in: path
      required: true
      description: Subscription id
      schema:
        type: string
        format: uuid
  responses:
    ValidationError:
      description: Invalid input (missing field, format error, zero or negative amount, date outside the allowed range)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: amountKurus sıfırdan büyük olmalıdır.
    Unauthorized:
      description: Authentication is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Geçerli bir oturum gerekli.
    NotFound:
      description: Record not found (records of other users return this response too)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Abonelik bulunamadı.
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: VALIDATION_ERROR
        message:
          type: string
          description: Text that can be shown to the user
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: ayse@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: At least 8 characters
    User:
      type: object
      required: [id, email, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
    Token:
      type: object
      required: [accessToken, tokenType]
      properties:
        accessToken:
          type: string
          description: JWT
        tokenType:
          type: string
          enum: [bearer]
    Period:
      type: string
      enum: [monthly, yearly]
    SubscriptionCreate:
      type: object
      required: [serviceName, amountKurus, period, startDate]
      properties:
        serviceName:
          type: string
          minLength: 1
          maxLength: 100
          example: Netflix
        amountKurus:
          type: integer
          minimum: 1
          description: Amount in kuruş (22999 for 229.99 TL). Zero and negative values are rejected.
          example: 22999
        period:
          $ref: '#/components/schemas/Period'
        startDate:
          type: string
          format: date
          description: >-
            Date of the first charge; renewals start one period after this date.
            Past dates are valid. A future date can be at most 366 days after today.
            The earliest accepted date is 2000-01-01. Anything outside this range returns 400.
          example: '2026-01-31'
    Subscription:
      type: object
      required: [id, serviceName, amountKurus, currency, period, startDate, nextRenewalDate, status, reminders, createdAt]
      properties:
        id:
          type: string
          format: uuid
        serviceName:
          type: string
        amountKurus:
          type: integer
          minimum: 1
        currency:
          type: string
          enum: [TRY]
        period:
          $ref: '#/components/schemas/Period'
        startDate:
          type: string
          format: date
        nextRenewalDate:
          type: string
          format: date
          description: Next renewal day (calculated from the start date)
        status:
          type: string
          enum: [active, cancelled]
        reminders:
          type: array
          description: Read-only reminders of this subscription
          items:
            $ref: '#/components/schemas/ReminderSummary'
        createdAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
          nullable: true
    ReminderSummary:
      type: object
      required: [daysBefore, remindOn, status]
      properties:
        daysBefore:
          type: integer
          enum: [3, 1]
        remindOn:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ReminderStatus'
    ReminderStatus:
      type: string
      description: created = generated, sent_mock = mock notification sent
      enum: [created, sent_mock]
    Reminder:
      type: object
      required: [id, subscriptionId, renewalDate, daysBefore, remindOn, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        subscriptionId:
          type: string
          format: uuid
        renewalDate:
          type: string
          format: date
        daysBefore:
          type: integer
          enum: [3, 1]
        remindOn:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ReminderStatus'
        createdAt:
          type: string
          format: date-time
