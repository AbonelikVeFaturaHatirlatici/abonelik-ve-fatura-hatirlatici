services:
  db:
    image: postgres:16-alpine
    container_name: abonelik_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: abonelik
      POSTGRES_USER: abonelik
      POSTGRES_PASSWORD: abonelik
      TZ: Europe/Istanbul
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abonelik -d abonelik"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abonelik_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://abonelik:abonelik@db:5432/abonelik
      JWT_SECRET: degistir-beni-uzun-rastgele-bir-deger
      JWT_EXPIRE_MINUTES: 1440
      TZ: Europe/Istanbul
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
