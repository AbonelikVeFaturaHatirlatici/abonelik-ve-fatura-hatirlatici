name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  openapi-lint:
    name: openapi-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Spectral lint (api/ varsa)
        run: |
          if ls api/*.y*ml >/dev/null 2>&1; then
            npx --yes @stoplight/spectral-cli@6 lint api/*.y*ml
          else
            echo "api/ henüz yok, adım atlandı."
          fi

  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint ve test (backend/ varsa)
        run: |
          if [ -f backend/requirements.txt ]; then
            cd backend
            pip install -r requirements.txt pytest pytest-cov ruff
            ruff check .
            pytest --cov=app --cov-fail-under=50
          else
            echo "backend/ henüz yok, adım atlandı."
          fi
